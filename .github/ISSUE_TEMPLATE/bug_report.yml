name: Bug report
description: 报告错误、崩溃或体检/签名结果不符合预期
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请**不要**粘贴密钥库口令、私钥或完整 `.p7b`；输出里的口令会被 hss 自动打码，但请再检查一遍。

  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么？期望是什么？
      placeholder: 运行 `hss sign` 时……期望……实际……
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 完整命令（口令用 `***` 代替）
      render: shell
      placeholder: |
        hss doctor
        hss sign --env release
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: 实际输出
      description: 完整报错或 `hss doctor --json` 的结果（请脱敏）
      render: shell
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node 版本
      placeholder: "v20.11.0"
    validations:
      required: true

  - type: input
    id: toolchain
    attributes:
      label: hap-sign-tool 版本
      description: 运行 `java -jar hap-sign-tool.jar -version` 的结果
      placeholder: "1.0.0"

  - type: input
    id: hss
    attributes:
      label: hss 版本
      description: 运行 `hss --version`
      placeholder: "0.3.0"
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已在输出中移除口令、私钥等敏感信息
          required: true
        - label: 我已搜索过现有 issue
          required: true

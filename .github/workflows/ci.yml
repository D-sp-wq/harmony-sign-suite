name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify CLI starts
        run: node dist/index.js --version

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm pack --pack-destination .pack

      - name: Assert tarball contains only the intended files
        run: |
          tgz=$(ls .pack/*.tgz)
          echo "tarball: $tgz"
          tar -tf "$tgz" | sort
          if tar -tf "$tgz" | grep -Eq '^package/(src|test|docs|scripts)/'; then
            echo "::error::source, test, docs or scripts leaked into the tarball"
            exit 1
          fi
          if tar -tf "$tgz" | grep -Eiq '\.(p12|p7b|pem|cer|jks|key)$'; then
            echo "::error::signing material leaked into the tarball"
            exit 1
          fi
          tar -tvf "$tgz" | grep 'dist/index.js' | grep -q '^-rwxr' || {
            echo "::error::dist/index.js is not executable in the tarball"
            exit 1
          }
